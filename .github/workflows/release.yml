name: Build and publish release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, 'Bootstrap release')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows packages
        shell: pwsh
        run: ./build.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/release"
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v11.1.1" }
          $setup = (Get-ChildItem "release/WWE-2K26-MyGM-Companion-*-Setup.exe" | Select-Object -First 1).FullName
          $change = (Get-ChildItem "release/CHANGELOG-*.md" | Select-Object -First 1).FullName
          $assets = @("release/MyGMCompanion-update.zip", "release/MyGMCompanion-update.zip.sha256", $setup, $change)
          gh release view "$releaseTag" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$releaseTag" $assets --clobber
            gh release edit "$releaseTag" --title "WWE 2K26 MyGM Companion $releaseTag" --notes-file "CHANGELOG.md"
          } else {
            gh release create "$releaseTag" $assets --title "WWE 2K26 MyGM Companion $releaseTag" --notes-file "CHANGELOG.md"
          }

