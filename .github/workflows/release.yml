name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows packages
        shell: pwsh
        run: ./build.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/release"
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "release/MyGMCompanion-update.zip" `
            "release/MyGMCompanion-update.zip.sha256" `
            "release/WWE-2K26-MyGM-Companion-*-Setup.exe" `
            "release/CHANGELOG-*.md" `
            --title "WWE 2K26 MyGM Companion ${{ github.ref_name }}" `
            --notes-file "CHANGELOG.md"
